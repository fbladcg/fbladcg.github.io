<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- Seguridad: el panel solo puede cargar código propio o de cdnjs (verificado con SRI)
       y solo puede conectarse a GitHub y al script de Google. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://script.google.com https://script.googleusercontent.com; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="img/icono-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/icono-16.png" sizes="16x16" type="image/png">
  <title>Panel de edición — FBLA 3281</title>
  <style>
    :root {
      --navy: #0a2e7f; --blue: #1d52bc; --gold: #f4ab19; --cobalt: #226add;
      --white: #ffffff; --black: #2d2b2b;
      --gris: #f3f5fa; --borde: #d5dcea; --suave: #55607a; --rojo: #c0392b;
      --radio: 12px;
      --letra: "Apercu Pro", Arial, "Helvetica Neue", Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--letra); color: var(--black); background: var(--gris); line-height: 1.5; }
    button, input, textarea { font: inherit; }
    [hidden] { display: none !important; }

    /* Barra */
    .barra { position: sticky; top: 0; z-index: 20; background: var(--navy); color: var(--white); border-bottom: 4px solid var(--gold); }
    .barra__fila { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .barra h1 { font-size: 1.1rem; margin: 0; flex: 1 1 auto; }
    .estado { font-size: .85rem; color: var(--gold); font-weight: 700; }
    .barra__botones { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Botones */
    .btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn--oro { background: var(--gold); color: var(--navy); }
    .btn--oro:disabled { opacity: .5; cursor: default; }
    .btn--claro { background: rgba(255,255,255,.14); color: var(--white); }
    .btn--azul { background: var(--blue); color: var(--white); }
    .btn--borde { background: var(--white); color: var(--navy); border: 2px solid var(--navy); }
    .btn--peligro { background: var(--white); color: var(--rojo); border: 2px solid var(--rojo); }
    .btn--chico { padding: 6px 12px; font-size: .9rem; }
    .btn--icono { padding: 6px 10px; background: var(--white); color: var(--navy); border: 1px solid var(--borde); border-radius: 8px; }
    .btn--icono:disabled { opacity: .35; cursor: default; }
    .btn--grande { width: 100%; justify-content: center; padding: 16px; border: 2px dashed var(--blue); background: var(--white); color: var(--blue); border-radius: var(--radio); }

    /* Diseño */
    .cuerpo { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; display: grid; grid-template-columns: 230px 1fr; gap: 24px; align-items: start; }
    .pestanas { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 4px; }
    .pestana { text-align: left; background: none; border: 0; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; color: var(--navy); }
    .pestana:hover { background: var(--white); }
    .pestana[aria-selected="true"] { background: var(--navy); color: var(--white); }
    .panel { background: var(--white); border-radius: var(--radio); padding: 24px; box-shadow: 0 4px 16px rgba(10,46,127,.06); min-width: 0; }
    .panel h2 { margin: 0 0 4px; color: var(--navy); font-size: 1.5rem; }
    .ayuda { color: var(--suave); margin: 0 0 20px; }

    /* Campos */
    .campo { margin-bottom: 16px; }
    .campo > label, .campo__titulo { display: block; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .campo input[type=text], .campo input[type=url], .campo input[type=email], .campo textarea, .login input[type=text], .login input[type=password] {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 8px; background: var(--white); color: var(--black);
    }
    .campo textarea { min-height: 96px; resize: vertical; }
    .campo input:focus, .campo textarea:focus, .login input:focus { outline: 3px solid rgba(34,106,221,.35); border-color: var(--cobalt); }
    .campo__nota { font-size: .85rem; color: var(--suave); margin-top: 4px; }
    .check { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--navy); }
    .check input { width: 22px; height: 22px; }

    .foto { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .foto__vista { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--gris); border: 1px dashed var(--borde); display: flex; align-items: center; justify-content: center; color: var(--suave); font-size: .8rem; text-align: center; }
    .foto__botones { display: flex; gap: 8px; flex-wrap: wrap; }
    .foto__ruta { flex-basis: 100%; font-size: .8rem; color: var(--suave); overflow-wrap: anywhere; }

    /* Listas */
    .lista { display: grid; gap: 14px; margin-bottom: 14px; }
    .item { border: 1.5px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
    .item__cabeza { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--gris); border-bottom: 1.5px solid var(--borde); flex-wrap: wrap; }
    .item__nombre { flex: 1 1 auto; font-weight: 700; color: var(--navy); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item__cuerpo { padding: 16px 14px 2px; }
    .vacio { padding: 20px; text-align: center; color: var(--suave); border: 1.5px dashed var(--borde); border-radius: var(--radio); margin-bottom: 14px; }
    .sublista { background: var(--gris); border-radius: var(--radio); padding: 14px; }
    .sublista .item { background: var(--white); }

    /* Álbumes y fotos */
    .subtitulo { color: var(--navy); margin: 0; font-size: 1.2rem; }
    .fila-titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 28px 0 8px; padding-top: 20px; border-top: 1.5px solid var(--borde); }
    .albumes-panel { display: grid; gap: 12px; }
    .album-p { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; border: 1.5px solid var(--borde); border-radius: var(--radio); padding: 10px; }
    .album-p__img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--gris); }
    .album-p__img--vacio { display: flex; align-items: center; justify-content: center; color: var(--suave); font-size: .8rem; }
    .album-p__info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .album-p__info strong { color: var(--navy); overflow-wrap: anywhere; }
    .album-p__info span { color: var(--suave); font-size: .9rem; }
    .album-p__botones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .pendientes__progreso { background: #fff; border: 1px solid #dde3ef; border-left: 5px solid #f4ab19; border-radius: 12px; padding: 12px 14px; margin: 6px 0 14px; }
    .pendientes__progreso[hidden] { display: none; }
    .pendientes__texto { margin: 0 0 8px; font-weight: 700; color: #0a2e7f; font-size: .95rem; }
    .foto-p__marco { position: relative; border-radius: 10px; overflow: hidden; background: #eef2f9; aspect-ratio: 4 / 3; }
    .foto-p__marco img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .foto-p__marco:not([data-carga="lista"]) img { visibility: hidden; }
    .foto-p__cargando { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; text-align: center; }
    .foto-p__marco[data-carga="lista"] .foto-p__cargando { display: none; }
    .foto-p__estado-texto { font-size: .85rem; font-weight: 700; color: #55607a; }
    .foto-p__marco[data-carga="espera"] .foto-p__estado-texto::before { content: "En espera…"; }
    .foto-p__marco[data-carga="cargando"] .foto-p__estado-texto::before { content: "Cargando foto…"; color: #0a2e7f; }
    .foto-p__marco[data-carga="error"] .foto-p__estado-texto::before { content: "No se pudo cargar"; color: #a1281d; }
    .foto-p__barra { width: 80%; height: 8px; background: #d9e0ec; border-radius: 999px; overflow: hidden; }
    .foto-p__marco[data-carga="error"] .foto-p__barra { display: none; }
    .foto-p__reintentar { display: none !important; }
    .foto-p__marco[data-carga="error"] .foto-p__reintentar { display: inline-flex !important; }
    .foto-p__barra span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1d52bc, #f4ab19); border-radius: 999px; transition: width .25s ease; }
    .foto-p__barra span.indeterminada { width: 40% !important; animation: indeterminada 1.1s ease-in-out infinite; }
    @keyframes indeterminada { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    .interruptores { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
    .interruptor { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .88rem; font-weight: 700; color: var(--navy); user-select: none; }
    .interruptor__input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .interruptor__pista { position: relative; width: 40px; height: 22px; border-radius: 999px; background: #c9d1e0; transition: background .2s; flex: none; }
    .interruptor__pista::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
    .interruptor__input:checked + .interruptor__pista { background: #1f9d55; }
    .interruptor__input:checked + .interruptor__pista::after { transform: translateX(18px); }
    .interruptor__input:focus-visible + .interruptor__pista { outline: 3px solid rgba(34,106,221,.4); outline-offset: 2px; }
    .interruptor--off { cursor: not-allowed; opacity: .5; }
    .albumes-envios { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 26px; }
    .album-envio { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border: 1.5px solid var(--borde); border-radius: var(--radio); padding: 10px 14px; }
    .album-envio__info { display: flex; flex-direction: column; min-width: 0; }
    .album-envio__info strong { color: var(--navy); }
    .album-envio__info span { color: var(--suave); font-size: .9rem; }
    .album-envio .interruptores { margin-top: 0; }
    .insignia { align-self: flex-start; font-size: .75rem !important; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--gris); color: var(--suave) !important; border: 1px solid var(--borde); }
    .insignia--si { background: var(--gold); color: var(--navy) !important; border-color: var(--gold); }
    .insignias { display: flex; gap: 6px; flex-wrap: wrap; }
    .fotos-panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 14px; }
    .foto-p { border: 1.5px solid var(--borde); border-radius: var(--radio); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--white); }
    .foto-p img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--gris); }
    .foto-p input[type=text], .foto-p select { width: 100%; padding: 7px 9px; border: 1.5px solid var(--borde); border-radius: 8px; font-size: .9rem; background: var(--white); }
    .foto-p--portada { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
    .foto-p--aprobada { border-color: #1d7a3a; }
    .foto-p__autor, .foto-p__info { font-size: .82rem; color: var(--suave); overflow-wrap: anywhere; }
    .foto-p__campo { display: flex; flex-direction: column; gap: 4px; }
    .foto-p__campo label { font-weight: 700; color: var(--navy); }
    .foto-p__ok { color: #1d7a3a; font-size: .9rem; }
    .foto-p__aprobar { display: flex; flex-direction: column; gap: 8px; }
    .foto-p__botones { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn--rojo { color: var(--rojo); }
    .aviso--info { background: #eaf1fd; border-color: var(--cobalt); overflow-wrap: anywhere; }

    /* Espacio usado */
    .almacen { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--white); border: 1px solid var(--borde); display: flex; flex-direction: column; gap: 6px; font-size: .8rem; color: var(--suave); }
    .almacen__barra { display: block; height: 6px; border-radius: 999px; background: var(--gris); overflow: hidden; }
    .almacen__barra span { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
    .almacen--medio .almacen__barra span { background: var(--gold); }
    .almacen--alto .almacen__barra span { background: var(--rojo); }
    .almacen__aviso { color: var(--rojo); font-weight: 700; }

    /* Documentos */
    .doc-actual { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1.5px solid var(--borde); border-radius: 10px; padding: 10px 12px; background: var(--gris); }
    .doc-actual__icono { font-size: 2rem; }
    .doc-actual__info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .doc-actual__info strong { color: var(--navy); overflow-wrap: anywhere; }
    .doc-actual__info span { font-size: .85rem; color: var(--suave); }

    /* Listas plegables */
    .lista__barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .lista { gap: 8px !important; }
    .item__nombre { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left;
      background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--navy); font: inherit; font-weight: 700; }
    .item__flecha { color: var(--blue); width: 14px; flex: none; }
    .item__titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .item__extra { flex: none; font-weight: 400; font-size: .82rem; color: var(--suave); background: var(--white); border: 1px solid var(--borde); border-radius: 999px; padding: 2px 10px; }
    .item--cerrado .item__cabeza { border-bottom: 0; }
    .item--cerrado:hover { border-color: var(--cobalt); }
    .pestana { display: flex; align-items: center; gap: 6px; }
    .pestana__n { margin-left: auto; font-size: .75rem; background: var(--gris); color: var(--suave); border-radius: 999px; padding: 1px 8px; border: 1px solid var(--borde); }
    .pestana[aria-selected="true"] .pestana__n { background: rgba(255,255,255,.18); color: var(--white); border-color: transparent; }
    .pestana__n--alerta { background: var(--gold) !important; color: var(--navy) !important; border-color: var(--gold) !important; font-weight: 700; }
    .pestanas-movil { display: none; width: 100%; padding: 12px; border: 1.5px solid var(--borde); border-radius: 10px; font: inherit; font-weight: 700; color: var(--navy); background: var(--white); }

    .fila-candado { display: flex; gap: 8px; align-items: stretch; }
    .fila-candado input { flex: 1; min-width: 0; }
    .candado { white-space: nowrap; font-weight: 700; padding: 6px 12px; }
    .entrada--bloqueada { background: var(--gris) !important; color: var(--suave) !important; cursor: not-allowed; }
    .campo__peligro { color: var(--rojo) !important; font-weight: 700; }
    .selector-simple { width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 8px; background: var(--white); font: inherit; }

    /* Sugerencias de Instagram */
    .sug { display: grid; grid-template-columns: 240px 1fr; gap: 18px; border: 1.5px solid var(--borde); border-radius: var(--radio); padding: 14px; margin-bottom: 16px; background: var(--white); }
    .sug--aprobada { border-color: #1d7a3a; background: #f3fbf5; }
    .sug__post { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .sug__post img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--gris); }
    .sug__texto { margin: 0; font-size: .85rem; color: var(--suave); white-space: pre-line; max-height: 160px; overflow: auto; background: var(--gris); border-radius: 8px; padding: 8px; }
    .sug__enlace { font-weight: 700; font-size: .9rem; color: var(--blue); }
    .sug__form { min-width: 0; }
    @media (max-width: 760px) { .sug { grid-template-columns: 1fr; } .sug__post img { aspect-ratio: 16 / 10; } }

    /* Visitas */
    .visitas-tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .visitas-tarjeta { background: var(--navy); color: var(--white); border-radius: var(--radio); padding: 16px; text-align: center; border-bottom: 4px solid var(--gold); }
    .visitas-tarjeta__num { display: block; font-size: 2rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
    .visitas-tarjeta__txt { font-weight: 700; font-size: .9rem; }
    .grafica { display: flex; align-items: flex-end; gap: 3px; height: 170px; padding: 8px; background: var(--gris); border-radius: var(--radio); overflow-x: auto; }
    .grafica__col { flex: 1 0 18px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
    .grafica__barra { width: 100%; background: var(--blue); border-radius: 4px 4px 0 0; }
    .grafica__col:hover .grafica__barra { background: var(--gold); }
    .grafica__num { font-size: .68rem; color: var(--navy); font-weight: 700; }
    .grafica__dia { font-size: .62rem; color: var(--suave); white-space: nowrap; }
    .tabla-visitas { width: 100%; border-collapse: collapse; }
    .tabla-visitas th, .tabla-visitas td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); }
    .tabla-visitas td:last-child, .tabla-visitas th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .tabla-visitas th { color: var(--navy); font-size: .9rem; }

    /* Fecha de eventos */
    .tipos-fecha { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tipo-fecha { border: 1.5px solid var(--borde); background: var(--white); color: var(--navy); font-weight: 700; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
    .tipo-fecha--activo { background: var(--navy); border-color: var(--navy); color: var(--white); }
    .selectores-fecha { display: flex; flex-wrap: wrap; gap: 12px; }
    .selector { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 220px; flex: 1 1 220px; }
    .selector__etiqueta { font-size: .85rem; font-weight: 700; color: var(--suave); }
    .selector input[type=text] { width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 8px; }
    .selector__boton { text-align: left; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 8px; background: var(--white); color: var(--black); cursor: pointer; font-weight: 700; }
    .selector__boton:hover, .selector__boton[aria-expanded=true] { border-color: var(--cobalt); }
    .selector__boton--vacio { color: var(--suave); font-weight: 400; }
    .resumen-fecha { font-weight: 700; }
    .calendario { position: absolute; top: 100%; left: 0; z-index: 30; margin-top: 6px; background: var(--white); border: 1.5px solid var(--borde); border-radius: 12px; box-shadow: 0 12px 32px rgba(10,46,127,.18); padding: 12px; width: 300px; max-width: calc(100vw - 48px); }
    .calendario__cabeza { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--navy); }
    .calendario__nav { border: 0; background: var(--gris); color: var(--navy); width: 34px; height: 34px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
    .calendario__dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .calendario__sem { font-size: .75rem; font-weight: 700; color: var(--suave); padding: 4px 0; }
    .calendario__dia, .calendario__mes { border: 0; background: none; padding: 8px 0; border-radius: 8px; cursor: pointer; color: var(--black); font: inherit; }
    .calendario__dia:hover, .calendario__mes:hover { background: var(--gris); }
    .calendario__dia:disabled { color: #c3c9d6; cursor: default; background: none; }
    .calendario__dia--hoy { box-shadow: inset 0 0 0 2px var(--gold); font-weight: 700; }
    .calendario__dia--sel, .calendario__dia--sel:hover { background: var(--navy); color: var(--white); font-weight: 700; }
    .calendario__mes--pasado { color: #b3bccd; }
    .calendario__meses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .calendario__pie { display: flex; justify-content: space-between; margin-top: 10px; }

    /* Entrada */
    .login { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .login .panel { padding: 28px; }
    .login h2 { margin-top: 0; }
    .login label { display: block; font-weight: 700; color: var(--navy); margin: 14px 0 6px; }
    .login .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .login .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .login details { margin-top: 14px; color: var(--suave); }
    .login summary { cursor: pointer; font-weight: 700; color: var(--blue); }
    .error-caja { background: #fdecea; color: var(--rojo); border-radius: 8px; padding: 10px 12px; margin-top: 14px; font-weight: 700; }
    .aviso { background: #fff4e0; border: 1.5px solid var(--gold); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: .95rem; }

    /* Mensajes */
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy); color: var(--white); padding: 12px 20px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-weight: 700; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
    .toast--error { background: var(--rojo); }
    .ocupado__caja { background: var(--navy); border: 2px solid var(--gold); border-radius: 16px; padding: 22px 26px; width: min(340px, calc(100% - 32px)); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
    .ocupado__foto { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; display: block; margin: 0 auto 14px; border: 3px solid rgba(255,255,255,.25); }
    .ocupado__foto[hidden], .barra-progreso[hidden] { display: none; }
    .ocupado__texto { margin: 0; }
    .ocupado .barra-progreso { margin-top: 14px; background: rgba(255,255,255,.18); border: 0; }
    .barra-progreso { height: 10px; background: #f3f5fa; border: 1px solid #dde3ef; border-radius: 999px; overflow: hidden; }
    .barra-progreso span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1d52bc, #f4ab19); border-radius: 999px; transition: width .35s ease; }
    .progreso-fotos { position: fixed; right: 18px; bottom: 90px; z-index: 35; display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid #dde3ef; border-left: 5px solid #f4ab19; border-radius: 14px; padding: 12px 14px; width: min(340px, calc(100% - 36px)); box-shadow: 0 12px 30px rgba(10,46,127,.18); }
    .progreso-fotos[hidden] { display: none; }
    .progreso-fotos__foto { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: none; background: #f3f5fa; }
    .progreso-fotos__info { flex: 1; min-width: 0; }
    .progreso-fotos__texto { margin: 0 0 8px; font-weight: 700; color: #0a2e7f; font-size: .95rem; }
    .ocupado { position: fixed; inset: 0; background: rgba(10,46,127,.45); display: flex; align-items: center; justify-content: center; z-index: 40; color: var(--white); font-weight: 700; font-size: 1.2rem; }

    /* =========================================================
       Diseño profesional (capa final: unifica todo el panel)
       ========================================================= */
    :root { --fondo: #eef2f9; --sombra: 0 1px 2px rgba(10,46,127,.06), 0 6px 18px rgba(10,46,127,.06); --verde: #1d7a3a; }
    body { background: var(--fondo); font-size: 15px; }
    /* Barra superior */
    .barra { border-bottom: 3px solid var(--gold); box-shadow: 0 2px 10px rgba(10,46,127,.25); }
    .barra__fila { max-width: 1280px; padding: 10px 20px; gap: 16px; }
    .barra__marca { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
    .barra__marca img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
    .barra h1 { font-size: 1.05rem; line-height: 1.1; margin: 0; flex: none; }
    .barra__sub { font-size: .78rem; color: rgba(255,255,255,.75); }
    .estado { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; color: var(--white); background: rgba(255,255,255,.12); }
    .estado:empty { display: none; }
    .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .estado[data-estado="ok"] { color: #8be0a4; }
    .estado[data-estado="pendiente"] { color: var(--gold); background: rgba(244,171,25,.15); }
    /* Botones */
    .btn { border-radius: 10px; min-height: 40px; transition: background .15s, box-shadow .15s, transform .1s; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:focus-visible, .pestana:focus-visible, .item__nombre:focus-visible, .rapido:focus-visible, .tablero__fila:focus-visible { outline: 3px solid rgba(34,106,221,.45); outline-offset: 2px; }
    .btn--chico { min-height: 34px; }
    .btn--icono { min-height: 34px; border-radius: 8px; }
    .btn--azul:hover { background: var(--navy); }
    .btn--oro:hover:not(:disabled) { box-shadow: 0 4px 14px rgba(244,171,25,.45); }
    .btn--borde { border-width: 1.5px; }
    .btn--borde:hover { background: var(--gris); }
    .btn--peligro { border-width: 1.5px; }
    .btn--peligro:hover { background: #fdecea; }
    .btn--grande { border-width: 1.5px; border-radius: 12px; }
    .btn--grande:hover { background: #f5f8fe; }
    /* Estructura */
    .cuerpo { max-width: 1280px; grid-template-columns: 250px 1fr; gap: 28px; padding: 24px 20px 96px; }
    .pestanas { top: 78px; gap: 2px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
    .pestanas__grupo { display: block; margin: 14px 14px 4px; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
    .pestana { padding: 9px 14px; font-size: .95rem; border-radius: 8px; transition: background .12s; }
    .pestana:hover { background: rgba(255,255,255,.8); }
    .pestana[aria-selected="true"] { box-shadow: 0 2px 8px rgba(10,46,127,.25); }
    .panel { border: 1px solid #e1e7f2; box-shadow: var(--sombra); padding: 28px 32px; }
    .panel > h2, .panel__cabeza h2 { font-size: 1.45rem; letter-spacing: -.01em; }
    .panel > .ayuda, .panel__cabeza .ayuda { padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid #e6ebf4; }
    /* Campos */
    .campo { margin-bottom: 18px; }
    .campo > label, .campo__titulo { font-size: .9rem; }
    .campo input[type=text], .campo textarea, .selector-simple, .selector__boton, .login input[type=text], .login input[type=password] { border-width: 1px; border-color: #cfd8e8; min-height: 42px; transition: border-color .15s, box-shadow .15s; }
    .campo input:hover, .campo textarea:hover, .selector__boton:hover { border-color: #a9b8d4; }
    .campo input:focus, .campo textarea:focus, .selector-simple:focus, .login input:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 3px rgba(34,106,221,.18); }
    /* Listas */
    .item { border-width: 1px; border-color: #dbe2ef; background: var(--white); transition: border-color .15s, box-shadow .15s; }
    .item:not(.item--cerrado) { box-shadow: var(--sombra); border-color: #c9d4e8; }
    .item__cabeza { background: #f7f9fd; border-bottom-width: 1px; padding: 8px 12px; }
    .item__cuerpo { padding: 18px 16px 4px; }
    .sublista { background: #f7f9fd; border: 1px solid #e3e9f4; }
    .vacio { border-width: 1px; background: #fafbfe; }
    /* Tablero de Inicio */
    .tablero__rapidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .rapido { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 12px; border: 1px solid #dbe2ef; background: var(--white); color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s, transform .1s; }
    .rapido:hover { border-color: var(--cobalt); box-shadow: var(--sombra); transform: translateY(-1px); }
    .rapido__icono { font-size: 1.5rem; }
    .tablero { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .tablero__tarjeta { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 18px; border-radius: 12px; border: 1px solid #dbe2ef; background: #fbfcff; }
    .tablero__tarjeta > .tablero__lista, .tablero__tarjeta > .almacen { align-self: stretch; }
    .tablero__titulo { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
    .tablero__grande { display: block; font-size: 1.35rem; color: var(--navy); line-height: 1.2; }
    .tablero__sub { color: var(--suave); font-size: .9rem; }
    .tablero__cifras { display: flex; gap: 22px; flex-wrap: wrap; }
    .tablero__lista { display: flex; flex-direction: column; gap: 2px; }
    .tablero__fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; font: inherit; color: var(--black); cursor: pointer; text-align: left; }
    .tablero__fila:hover { background: #eef3fc; }
    .tablero__num { min-width: 28px; text-align: center; padding: 2px 8px; border-radius: 999px; background: var(--gris); color: var(--navy); font-size: .85rem; }
    .tablero__num--alerta { background: var(--gold); }
    .almacen { margin-top: 0; }
    /* Entrada */
    .login { max-width: 520px; margin: 56px auto; }
    .login__tarjeta { text-align: left; padding: 32px; }
    .login__emblema { display: block; width: 96px; height: 96px; margin: 0 auto 12px; filter: drop-shadow(0 6px 14px rgba(10,46,127,.25)); }
    .login h2 { text-align: center; color: var(--navy); }
    .login .ayuda { text-align: center; }
    /* Mensajes */
    .toast { border-radius: 12px; padding: 12px 18px; }
    .ocupado { backdrop-filter: blur(2px); }

    @media (max-width: 760px) {
      .cuerpo { grid-template-columns: 1fr; }
      .pestanas__grupo { display: none; }
      .pestanas { max-height: none; overflow: visible; }
      .barra__sub { display: none; }
      .panel { padding: 20px 16px; }
      .tablero__rapidos { grid-template-columns: repeat(2, 1fr); }
      .pestanas { position: static; }
      .pestanas .pestana { display: none; }
      .pestanas-movil { display: block; }
      .item__extra { display: none; }
      .item--cerrado .item__cabeza > .btn { display: none; }
      .panel { padding: 18px 14px; }
      .login .fila { grid-template-columns: 1fr; }
      .barra { position: static; }
      .barra h1 { flex-basis: 100%; font-size: 1rem; }
      #guardar { position: fixed; right: 16px; bottom: 16px; z-index: 30; padding: 14px 22px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
      #guardar:disabled { display: none; }
      .toast { bottom: 84px; }
      .item__nombre { flex-basis: 100%; }
      .item__cabeza .btn--peligro { margin-left: auto; }
      .album-p { grid-template-columns: 80px 1fr; }
      .album-p__img { width: 80px; height: 64px; }
      .album-p__botones { grid-column: 1 / -1; justify-content: flex-start; }
      .fotos-panel { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="barra">
    <div class="barra__fila">
      <div class="barra__marca">
        <img src="img/icono-180.png" alt="" width="36" height="36">
        <div>
          <h1>Panel de edición</h1>
          <span class="barra__sub">FBLA Capítulo 3281</span>
        </div>
      </div>
      <span class="estado" id="estado" role="status" aria-live="polite"></span>
      <div class="barra__botones" id="botones" hidden>
        <a class="btn btn--claro btn--chico" href="./" target="_blank" rel="noopener">Ver página ↗</a>
        <button class="btn btn--claro btn--chico" id="salir">Salir</button>
        <button class="btn btn--oro" id="guardar" disabled title="Ctrl + S">💾 Guardar cambios</button>
      </div>
    </div>
  </header>

  <!-- Pantalla de entrada -->
  <section class="login" id="login">
    <div class="panel login__tarjeta">
      <img class="login__emblema" src="img/emblema-512.png" alt="Emblema de FBLA" width="120" height="120">
      <h2>Entrar al panel</h2>
      <p class="ayuda">Pega la <strong>llave de GitHub</strong> (token) que te dieron. Solo tienes que hacerlo una vez en esta computadora.</p>
      <form id="form-login">
        <label for="token">Llave de GitHub (token)</label>
        <input type="password" id="token" autocomplete="off" placeholder="github_pat_..." required>
        <details id="detalles-repo">
          <summary>Datos del repositorio</summary>
          <div class="fila">
            <div>
              <label for="owner">Usuario de GitHub</label>
              <input type="text" id="owner" autocomplete="off" placeholder="fbla3281">
            </div>
            <div>
              <label for="repo">Repositorio</label>
              <input type="text" id="repo" autocomplete="off" placeholder="fbla3281.github.io">
            </div>
          </div>
        </details>
        <label class="check" style="margin-top:16px"><input type="checkbox" id="recordar" checked> Recordarme en esta computadora</label>
        <p class="campo__nota">No marques esta opción en una computadora compartida o de la escuela.</p>
        <div class="acciones">
          <button class="btn btn--azul" type="submit">Entrar</button>
        </div>
        <div class="error-caja" id="login-error" hidden></div>
      </form>
    </div>
  </section>

  <!-- Editor -->
  <div class="cuerpo" id="editor" hidden>
    <nav class="pestanas" id="pestanas" role="tablist" aria-label="Partes de la página"></nav>
    <main class="panel" id="panel"></main>
  </div>

  <div class="ocupado" id="ocupado" hidden>Guardando…</div>
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUklpXp6R6wMnYf5Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="fechas.js?v=4"></script>
  <script src="competencias.js?v=1"></script>
  <script src="admin.js?v=30"></script>
</body>
</html>
